<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>BGen — ИИ-генератор игр</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- ============================================ -->
  <!-- ПРЕЛОАДЕР: показывается при открытии          -->
  <!-- ============================================ -->
  <div id="preloader" class="preloader">
    <div class="preloader-content">
      <!-- [BE......] — прогресс-бар буквами -->
      <div class="bee-bar">
        <span class="bee-bracket">[</span>
        <span id="bee-letters" class="bee-letters">BE······</span>
        <span class="bee-bracket">]</span>
      </div>

      <!-- Пиксельный шарик, собирается из хаоса -->
      <canvas id="bee-ball" class="bee-ball" width="240" height="240"></canvas>

      <!-- GEN появляется внизу -->
      <div id="bee-gen" class="bee-gen"></div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ                           -->
  <!-- ============================================ -->
  <div id="app" class="app-root" hidden>
    <header class="bgen-header">
      <h1>🎮 BGen</h1>
      <p class="subtitle">ИИ-генератор браузерных игр</p>
    </header>

    <section class="bgen-controls">
      <textarea
        id="promptInput"
        class="bgen-input"
        placeholder="замути змейку для бабушки"
        rows="2"
        maxlength="500"
      ></textarea>

      <div class="bgen-row">
        <select id="audienceSelect" class="bgen-select">
          <option value="default">🎯 Обычная</option>
          <option value="elderly">👵 Для бабушки</option>
          <option value="kids">🧒 Для детей</option>
          <option value="hardcore">🔥 Хардкор</option>
        </select>

        <button id="generateBtn" class="bgen-btn bgen-btn-primary">
          ✨ Создать игру
        </button>
      </div>

      <div id="statusBar" class="bgen-status" hidden></div>

      <div id="iterationPanel" class="bgen-iteration" hidden>
        <input
          id="iterationInput"
          class="bgen-input bgen-input-small"
          placeholder="сделай кнопки больше / добавь уровни..."
          maxlength="200"
        />
        <button id="iterateBtn" class="bgen-btn">🔧 Доработать</button>
      </div>
    </section>

    <section class="bgen-preview">
      <div class="bgen-preview-header">
        <span id="previewMeta" class="bgen-meta">Игра появится здесь</span>
        <button id="exportBtn" class="bgen-btn bgen-btn-icon" title="Скачать .html" hidden>⬇</button>
        <button id="shareBtn" class="bgen-btn bgen-btn-icon" title="Поделиться" hidden>↗</button>
        <button id="fullscreenBtn" class="bgen-btn bgen-btn-icon" title="На весь экран" hidden>⛶</button>
        <button id="restartBtn" class="bgen-btn bgen-btn-icon" title="Начать заново" hidden>⟳</button>
      </div>
      <iframe
        id="gameFrame"
        class="bgen-frame"
        sandbox="allow-scripts"
        title="Сгенерированная игра"
      ></iframe>
    </section>

    <section id="gallerySection" class="bgen-gallery" hidden>
      <h2>📚 Мои игры</h2>
      <div id="galleryList" class="bgen-gallery-list"></div>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
